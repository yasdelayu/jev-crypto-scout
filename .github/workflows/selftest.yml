name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all offline selftests (no network, no API keys needed)
        run: |
          python3 scout.py --selftest
          python3 scalp.py --selftest
          python3 indicators.py
          python3 history.py
          python3 telegram_notify.py
          python3 listings.py
          python3 botconfig.py
          python3 bot.py --selftest
          python3 attention.py
          python3 validate.py --selftest
          python3 paper.py --selftest
